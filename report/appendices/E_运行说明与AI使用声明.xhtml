<section xmlns="http://www.w3.org/1999/xhtml" id="appendix-e" class="report-appendix">
  <h2>附录E：运行说明与AI使用声明</h2>
  <p>复现时先检查 Git 提交与工作树，再运行 <code>make check</code> 和 <code>make report-check</code>；已通过的正式 runner 不应因复现便利而重复运行。AI 用于代码组织、检查器实现、文档整理和可复现性核验；所有提交前的范围、阶段门、数值结论和报告边界均以仓库内配置、自动检查与人工审核为准。AI 未提供实验测量，不得将其输出解释为实验校准或独立物理验证。</p>
