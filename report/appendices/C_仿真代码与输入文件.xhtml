<section xmlns="http://www.w3.org/1999/xhtml" id="appendix-c" class="report-appendix">
  <h2>附录C：仿真代码与输入文件</h2>
  <p>项目入口为根目录 <code>Makefile</code>。静态总检查为 <code>make check</code>，报告结构检查为 <code>make report-check</code>，最终自包含 HTML 由 <code>make report</code> 生成。二维器件脚本位于 <code>tcad/</code>，紧凑模型与两路线脚本位于 <code>scripts/</code> 和 <code>spice/</code>。每个正式阶段的配置、运行器、独立 checker、命令记录和报告均使用版本化文件名，不能由本附录替代证据报告。</p>
</section>
